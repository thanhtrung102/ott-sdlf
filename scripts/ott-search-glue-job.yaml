AWSTemplateFormatVersion: "2010-09-09"
Description: OTT Search Events — Glue enrichment job (standalone, no SDLF)

Parameters:
  pTeamName:
    Type: String
    Description: Team name
    AllowedPattern: "[a-z0-9]{2,12}"
    ConstraintDescription: 2-12 lowercase letters/numbers
  pDatasetName:
    Type: String
    Description: Dataset name
    AllowedPattern: "[a-z0-9]{2,12}"
    ConstraintDescription: 2-12 lowercase letters/numbers
  pArtifactsBucket:
    Type: String
    Description: S3 bucket that holds the Glue script and extra-py-files zip
  pKmsKeyArn:
    Type: String
    Description: KMS key ARN used for S3 SSE-KMS on the data bucket
  pPipelineDeploymentInstance:
    Type: String
    Default: mainB

Resources:
  rGlueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub sdlf-${pTeamName}-${pDatasetName}-glue-role
      Path: /service-role/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSGlueServiceRole
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonS3FullAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/CloudWatchLogsFullAccess
      Policies:
        - PolicyName: !Sub sdlf-${pTeamName}-${pDatasetName}-kms-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - kms:CreateGrant
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:GenerateDataKey*
                  - kms:ReEncrypt*
                Resource: !Ref pKmsKeyArn

  rGlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub sdlf-${pTeamName}-${pDatasetName}-glue-job
      Role: !Ref rGlueRole
      GlueVersion: "4.0"
      WorkerType: G.1X
      NumberOfWorkers: 10
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub s3://${pArtifactsBucket}/artifacts/ott-search-glue-job.py
      DefaultArguments:
        "--job-bookmark-option": "job-bookmark-disable"
        "--enable-metrics": ""
        "--enable-continuous-cloudwatch-log": "true"
        "--enable-continuous-log-filter": "true"
        "--extra-py-files": !Sub "s3://${pArtifactsBucket}/artifacts/genre_classifier_pkg.zip"
      ExecutionProperty:
        MaxConcurrentRuns: 1
      MaxRetries: 1
      Timeout: 60
      Tags:
        Framework: standalone
        Team: !Ref pTeamName
        Dataset: !Ref pDatasetName
        Project: fpt-play-search-analytics

Outputs:
  oGlueJobName:
    Description: Glue job name
    Value: !Ref rGlueJob
    Export:
      Name: !Sub ${AWS::StackName}-glue-job-name

  oGlueRoleArn:
    Description: Glue IAM role ARN
    Value: !GetAtt rGlueRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-glue-role-arn

  oPipelineDeploymentInstance:
    Description: Pipeline deployment instance this job belongs to
    Value: !Ref pPipelineDeploymentInstance
