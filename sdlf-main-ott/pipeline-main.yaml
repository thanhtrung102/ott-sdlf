AWSTemplateFormatVersion: "2010-09-09"
Description: OTT team main pipeline — Stage A (event-driven crawl) + Stage B (Glue ETL enrichment)

Parameters:
  pPipelineReference:
    Type: String
    Default: none

Resources:
  rMainA:
    Type: awslabs::sdlf::stageA::MODULE
    Properties:
      pPipelineReference: !Ref pPipelineReference
      pStageName: A
      pPipeline: main
      pTeamName: ott
      pTriggerType: event
      pEventPattern: >-
        {
          "source": ["aws.s3"],
          "detail-type": ["Object Created"],
          "detail": {
            "bucket": {
              "name": ["{{resolve:ssm:/SDLF2/S3/RawBucket}}"]
            },
            "object": {
              "key": [{ "prefix": "ott/searchevents/" }]
            }
          }
        }
      pEnableTracing: false

  rMainB:
    Type: awslabs::sdlf::stageB::MODULE
    Properties:
      pPipelineReference: !Ref pPipelineReference
      pDatasetBucket: "{{resolve:ssm:/SDLF2/S3/StageBucket}}"
      pStageName: B
      pPipeline: main
      pTeamName: ott
      pTriggerType: schedule
      pEventPattern: !Sub >-
        {
          "source": ["aws.states"],
          "detail-type": ["Step Functions Execution Status Change"],
          "detail": {
            "status": ["SUCCEEDED"],
            "stateMachineArn": ["arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:sdlf-ott-main-sm-A"]
          }
        }
      pSchedule: "cron(30 18 * * ? *)"
      pEnableTracing: false
