AWSTemplateFormatVersion: "2010-09-09"
Description: OTT searchevents pipeline — Stage A (event-driven Lambda) + Stage B (Glue ETL)

Parameters:
  pPipelineReference:
    Type: String
    Default: none

Resources:
  rMainA:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: "{{resolve:ssm:/sdlf/stagelambda/main}}"
      Parameters:
        pPipelineReference: !Ref pPipelineReference
        pDeploymentInstance: ott-mainA
        pStorageDeploymentInstance: prod
        pDatasetDeploymentInstance: searchevents
        pTriggerType: event
        pEventPattern: >-
          {
            "source": ["aws.s3"],
            "detail-type": ["Object Created"],
            "detail": {
              "bucket": {
                "name": ["{{resolve:ssm:/sdlf/storage/rRawBucket/prod}}"]
              },
              "object": {
                "key": [{ "prefix": "ott/searchevents/" }]
              }
            }
          }
        pEnableTracing: "false"

  rMainB:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: "{{resolve:ssm:/sdlf/stageglue/main}}"
      Parameters:
        pPipelineReference: !Ref pPipelineReference
        pDeploymentInstance: ott-mainB
        pStorageDeploymentInstance: prod
        pDatasetDeploymentInstance: searchevents
        pGlueJobName: sdlf-ott-searchevents-glue-job
        pGlueNumberOfWorkers: 10
        pGlueWorkerType: G.1X
        pTriggerType: event
        pEventPattern: >-
          {
            "source": ["aws.states"],
            "detail-type": ["Step Functions Execution Status Change"],
            "detail": {
              "status": ["SUCCEEDED"],
              "stateMachineArn": ["{{resolve:ssm:/sdlf/pipeline/rStateMachine/ott-mainA}}"]
            }
          }
        pSchedule: "cron(0 19 * * ? *)"
        pEnableTracing: "false"
        pGlueArguments: >-
          {
            "--job-bookmark-option": "job-bookmark-disable",
            "--enable-metrics": "",
            "--SOURCE_LOCATION": "s3://{{resolve:ssm:/sdlf/storage/rRawBucket/prod}}/ott/searchevents/",
            "--OUTPUT_LOCATION": "s3://{{resolve:ssm:/sdlf/storage/rAnalyticsBucket/prod}}/ott/searchevents/curated/",
            "--PUSH_DOWN_PREDICATE": "all"
          }
