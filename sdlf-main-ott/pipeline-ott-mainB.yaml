AWSTemplateFormatVersion: "2010-09-09"
Description: OTT searchevents Stage B — Glue ETL enrichment (schedule + Stage A event)

Parameters:
  pPipelineReference:
    Type: String
    Default: none
  pRawBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rRawBucket/prod
  pKmsKeyArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rKMSKey/prod

Resources:
  rMainB:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: "{{resolve:ssm:/sdlf/stageglue/main}}"
      Parameters:
        pPipelineReference: !Ref pPipelineReference
        pDeploymentInstance: ott-mainB
        pStorageDeploymentInstance: prod
        pDatasetDeploymentInstance: searchevents
        pGlueJobName: sdlf-ott-searchevents-glue-job
        pGlueNumberOfWorkers: 10
        pGlueWorkerType: G.1X
        pTriggerType: event
        pEventPattern: >-
          {
            "source": ["aws.states"],
            "detail-type": ["Step Functions Execution Status Change"],
            "detail": {
              "status": ["SUCCEEDED"],
              "stateMachineArn": ["{{resolve:ssm:/sdlf/pipeline/rStateMachine/ott-mainA}}"]
            }
          }
        pSchedule: "cron(0 19 * * ? *)"
        pEnableTracing: "false"
        pGlueArguments: >-
          {
            "--job-bookmark-option": "job-bookmark-enable",
            "--enable-metrics": "",
            "--SOURCE_LOCATION": "s3://{{resolve:ssm:/sdlf/storage/rRawBucket/prod}}/ott/searchevents/",
            "--OUTPUT_LOCATION": "s3://{{resolve:ssm:/sdlf/storage/rAnalyticsBucket/prod}}/ott/searchevents/curated/",
            "--PUSH_DOWN_PREDICATE": "all"
          }

  ######## RAW CATALOG ########

  rRawCrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sdlf-ott-raw-crawler-role
      Path: /sdlf-ott/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: sdlf-ott-raw-crawler-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pRawBucket}
                  - !Sub arn:${AWS::Partition}:s3:::${pRawBucket}/ott/searchevents/*
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref pKmsKeyArn

  rRawCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: sdlf-searchevents-raw-crawler
      Role: !GetAtt rRawCrawlerRole.Arn
      DatabaseName: fpt_ott_searchevents_raw
      Targets:
        S3Targets:
          - Path: !Sub s3://${pRawBucket}/ott/searchevents/
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG
      RecrawlPolicy:
        RecrawlBehavior: CRAWL_NEW_FOLDERS_ONLY
      Schedule:
        ScheduleExpression: "cron(30 19 * * ? *)"
