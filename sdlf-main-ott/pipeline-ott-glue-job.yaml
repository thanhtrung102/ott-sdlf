AWSTemplateFormatVersion: "2010-09-09"
Description: >
  OTT Search Events — Glue enrichment job (standalone, no SDLF).
  Source: glue/ott-search-glue-job.py

Parameters:
  pTeamName:
    Type: String
    Description: Team name
    AllowedPattern: "[a-z0-9]{2,12}"
    ConstraintDescription: 2-12 lowercase letters/numbers
  pDatasetName:
    Type: String
    Description: Dataset name
    AllowedPattern: "[a-z0-9]{2,12}"
    ConstraintDescription: 2-12 lowercase letters/numbers
  pArtifactsBucket:
    Type: String
    Description: S3 bucket that holds the Glue script and extra-py-files zip
  pRawBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rRawBucket/prod
    Description: Raw S3 bucket
  pStageBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rStageBucket/prod
    Description: Stage S3 bucket
  pAnalyticsBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rAnalyticsBucket/prod
    Description: Analytics S3 bucket
  pKmsKeyArn:
    Type: String
    Description: KMS key ARN used for S3 SSE-KMS on the data bucket
  pPipelineDeploymentInstance:
    Type: String
    Default: mainB
  pGlueDatabaseName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/dataset/rAnalyticsGlueDataCatalog/searchevents
    Description: Glue database that holds curated and raw catalog tables

Resources:
  rGlueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub sdlf-${pTeamName}-${pDatasetName}-glue-role
      Path: /service-role/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: !Sub sdlf-${pTeamName}-${pDatasetName}-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  # Glue script + classifier zip live at ott/searchevents/, not the legacy artifacts/ prefix.
                  - !Sub arn:${AWS::Partition}:s3:::${pArtifactsBucket}/${pTeamName}/${pDatasetName}/*
                  - !Sub arn:${AWS::Partition}:s3:::${pRawBucket}/${pTeamName}/${pDatasetName}/*
                  - !Sub arn:${AWS::Partition}:s3:::${pStageBucket}/${pTeamName}/${pDatasetName}/*
                  - !Sub arn:${AWS::Partition}:s3:::${pAnalyticsBucket}/${pTeamName}/${pDatasetName}/*
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pArtifactsBucket}
                  - !Sub arn:${AWS::Partition}:s3:::${pRawBucket}
                  - !Sub arn:${AWS::Partition}:s3:::${pStageBucket}
                  - !Sub arn:${AWS::Partition}:s3:::${pAnalyticsBucket}
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*
              - Effect: Allow
                Action:
                  - kms:CreateGrant
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:GenerateDataKey*
                  - kms:ReEncrypt*
                Resource:
                  - !Ref pKmsKeyArn
                  - "{{resolve:ssm:/SDLF2/KMS/KeyArn}}"
        # The three policies below were historically applied out-of-band
        # (put-role-policy) and owned by no CloudFormation stack. They are
        # declared here so the Glue role is fully defined by this template.
        # glue-kms-artifacts: decrypt the Glue script + classifier zip in the
        # project bucket (encrypted with its own KMS key, distinct from the
        # SDLF key) — without this a clean deploy fails to read --extra-py-files.
        - PolicyName: glue-kms-artifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: GlueArtifactsKMS
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:ReEncrypt*
                  - kms:CreateGrant
                Resource:
                  - !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/5ce12d85-6891-4b70-b225-0471ef278219
                  - !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/26f9e159-723a-4d6b-bc63-7f8a745f88e6
        # glue-s3-write: read/write the raw, stage and analytics data buckets.
        - PolicyName: glue-s3-write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: GlueS3WriteAnalytics
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:GetObjectVersion
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:AbortMultipartUpload
                  - s3:PutObjectTagging
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::fpt-ott-${AWS::Region}-${AWS::AccountId}-analytics-prod
                  - !Sub arn:${AWS::Partition}:s3:::fpt-ott-${AWS::Region}-${AWS::AccountId}-stage-prod
                  - !Sub arn:${AWS::Partition}:s3:::fpt-ott-${AWS::Region}-${AWS::AccountId}-raw-prod
                  - !Sub arn:${AWS::Partition}:s3:::fpt-ott-${AWS::Region}-${AWS::AccountId}-analytics-prod/*
                  - !Sub arn:${AWS::Partition}:s3:::fpt-ott-${AWS::Region}-${AWS::AccountId}-stage-prod/*
                  - !Sub arn:${AWS::Partition}:s3:::fpt-ott-${AWS::Region}-${AWS::AccountId}-raw-prod/*
        # sdlf-ott-kms-access: SDLF infrastructure + foundations KMS keys.
        - PolicyName: sdlf-ott-kms-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowSDLFKMSKeys
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                  - kms:GenerateDataKey*
                  - kms:ReEncrypt*
                  - kms:DescribeKey
                Resource:
                  - !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/b0103352-61f4-4cf9-95f0-63cd89b33be2
                  - !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/26f9e159-723a-4d6b-bc63-7f8a745f88e6

  rGlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub sdlf-${pTeamName}-${pDatasetName}-glue-job
      Role: !GetAtt rGlueRole.Arn
      GlueVersion: "4.0"
      WorkerType: G.1X
      NumberOfWorkers: 10
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub s3://${pArtifactsBucket}/ott/searchevents/ott-search-glue-job.py
      DefaultArguments:
        "--job-bookmark-option": "job-bookmark-enable"
        "--enable-metrics": ""
        "--enable-continuous-cloudwatch-log": "true"
        "--enable-continuous-log-filter": "true"
        "--extra-py-files": !Sub "s3://${pArtifactsBucket}/ott/searchevents/genre_classifier_pkg.zip"
      ExecutionProperty:
        MaxConcurrentRuns: 1
      MaxRetries: 1
      Timeout: 60
      Tags:
        Framework: standalone
        Team: !Ref pTeamName
        Dataset: !Ref pDatasetName
        Project: fpt-play-search-analytics

  rRawSearchEventsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref pGlueDatabaseName
      TableInput:
        Name: raw_search_events
        Description: >-
          Raw OTT search event Parquet files. Partition `dt` is YYYYMMDD on
          disk (no dashes), matching the upstream ingest's bare directory layout.
          KMS-locked from analyst roles; only the Glue ETL role + LF data-access
          role can read this table. Curated downstream uses YYYY-MM-dd — the
          Glue script normalizes between formats; no analyst should need to join
          raw + curated directly.
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyyMMdd
          # Bounded to active data window (June 2022 + July headroom for incoming ingest).
          # Wider ranges waste Athena's projection arithmetic on every query.
          projection.dt.range: "20220601,20220901"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub s3://${pRawBucket}/${pTeamName}/${pDatasetName}/${!dt}/
        StorageDescriptor:
          Location: !Sub s3://${pRawBucket}/${pTeamName}/${pDatasetName}/
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - Name: eventid
              Type: string
            - Name: datetime
              Type: string
            - Name: keyword
              Type: string
            - Name: category
              Type: string
            - Name: action
              Type: string
            - Name: platform
              Type: string
            - Name: networktype
              Type: string
            - Name: userplansmap
              Type: array<string>
            - Name: proxy_isp
              Type: string
            - Name: user_id
              Type: string
        PartitionKeys:
          - Name: dt
            Type: string

  rCuratedSearchEventsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref pGlueDatabaseName
      TableInput:
        Name: curated
        Description: >-
          Curated OTT search events — 17-column enriched Parquet, partitioned by
          (dt, derived_genre) — derived_genre is path-partitioned by the Glue
          write. Partition `dt` is ISO YYYY-MM-dd (different from raw's
          YYYYMMDD). This is the canonical analyst-facing layer; raw is KMS-locked.
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2022-06-01,2022-09-01"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          projection.derived_genre.type: enum
          projection.derived_genre.values: "PHIM_TRUNG,PHIM_VIET,PHIM_HAN,PHIM_AU_MY,ANIME,THE_THAO,NHAC,TRUYEN_HINH,UNKNOWN,EMPTY_QUERY"
          storage.location.template: !Sub s3://${pAnalyticsBucket}/${pTeamName}/${pDatasetName}/curated/dt=${!dt}/derived_genre=${!derived_genre}/
        StorageDescriptor:
          Location: !Sub s3://${pAnalyticsBucket}/${pTeamName}/${pDatasetName}/curated/
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - Name: event_id
              Type: string
            - Name: event_ts
              Type: timestamp
            - Name: hour_of_day_vn
              Type: int
            - Name: user_id_hashed
              Type: string
            - Name: user_is_authenticated
              Type: boolean
            - Name: session_action
              Type: string
            - Name: is_search_abandoned
              Type: boolean
            - Name: keyword_norm
              Type: string
            - Name: platform_group
              Type: string
            - Name: network_type_norm
              Type: string
            - Name: isp_segment
              Type: string
            - Name: has_premium
              Type: boolean
            - Name: subscription_count
              Type: int
            - Name: plan_names
              Type: array<string>
            - Name: search_session_id
              Type: string
            - Name: is_repeat_search
              Type: boolean
            - Name: _pipeline_run_id
              Type: string
        PartitionKeys:
          - Name: dt
            Type: string
          - Name: derived_genre
            Type: string

Outputs:
  # Outputs are still visible via describe-stacks; the `Export.Name` blocks
  # were removed after verifying zero importers via cloudformation:ListImports.
  oGlueJobName:
    Description: Glue job name
    Value: !Ref rGlueJob

  oGlueRoleArn:
    Description: Glue IAM role ARN
    Value: !GetAtt rGlueRole.Arn

  oPipelineDeploymentInstance:
    Description: Pipeline deployment instance this job belongs to
    Value: !Ref pPipelineDeploymentInstance
