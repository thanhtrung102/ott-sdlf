AWSTemplateFormatVersion: "2010-09-09"
Description: >
  OTT Search Events — Glue enrichment job (standalone, no SDLF).
  Source: glue/ott-search-glue-job.py

Parameters:
  pTeamName:
    Type: String
    Description: Team name
    AllowedPattern: "[a-z0-9]{2,12}"
    ConstraintDescription: 2-12 lowercase letters/numbers
  pDatasetName:
    Type: String
    Description: Dataset name
    AllowedPattern: "[a-z0-9]{2,12}"
    ConstraintDescription: 2-12 lowercase letters/numbers
  pArtifactsBucket:
    Type: String
    Description: S3 bucket that holds the Glue script and extra-py-files zip
  pRawBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rRawBucket/prod
    Description: Raw S3 bucket
  pStageBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rStageBucket/prod
    Description: Stage S3 bucket
  pAnalyticsBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rAnalyticsBucket/prod
    Description: Analytics S3 bucket
  pKmsKeyArn:
    Type: String
    Description: KMS key ARN used for S3 SSE-KMS on the data bucket
  pPipelineDeploymentInstance:
    Type: String
    Default: mainB
  pGlueDatabaseName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/dataset/rAnalyticsGlueDataCatalog/searchevents
    Description: Glue database that holds curated and raw catalog tables

Resources:
  rGlueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub sdlf-${pTeamName}-${pDatasetName}-glue-role
      Path: /service-role/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: !Sub sdlf-${pTeamName}-${pDatasetName}-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pArtifactsBucket}/artifacts/*
                  - !Sub arn:${AWS::Partition}:s3:::${pRawBucket}/${pTeamName}/${pDatasetName}/*
                  - !Sub arn:${AWS::Partition}:s3:::${pStageBucket}/${pTeamName}/${pDatasetName}/*
                  - !Sub arn:${AWS::Partition}:s3:::${pAnalyticsBucket}/${pTeamName}/${pDatasetName}/*
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pArtifactsBucket}
                  - !Sub arn:${AWS::Partition}:s3:::${pRawBucket}
                  - !Sub arn:${AWS::Partition}:s3:::${pStageBucket}
                  - !Sub arn:${AWS::Partition}:s3:::${pAnalyticsBucket}
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*
              - Effect: Allow
                Action:
                  - kms:CreateGrant
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:GenerateDataKey*
                  - kms:ReEncrypt*
                Resource:
                  - !Ref pKmsKeyArn
                  - "{{resolve:ssm:/SDLF2/KMS/KeyArn}}"

  rGlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub sdlf-${pTeamName}-${pDatasetName}-glue-job
      Role: !GetAtt rGlueRole.Arn
      GlueVersion: "4.0"
      WorkerType: G.1X
      NumberOfWorkers: 10
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub s3://${pArtifactsBucket}/artifacts/ott-search-glue-job.py
      DefaultArguments:
        "--job-bookmark-option": "job-bookmark-enable"
        "--enable-metrics": ""
        "--enable-continuous-cloudwatch-log": "true"
        "--enable-continuous-log-filter": "true"
        "--extra-py-files": !Sub "s3://${pArtifactsBucket}/artifacts/genre_classifier_pkg.zip"
      ExecutionProperty:
        MaxConcurrentRuns: 1
      MaxRetries: 1
      Timeout: 60
      Tags:
        Framework: standalone
        Team: !Ref pTeamName
        Dataset: !Ref pDatasetName
        Project: fpt-play-search-analytics

  rRawSearchEventsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref pGlueDatabaseName
      TableInput:
        Name: raw_search_events
        Description: Raw OTT search event Parquet files — schema contract for upstream change detection
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyyMMdd
          projection.dt.range: "20220101,NOW+1YEARS"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub s3://${pRawBucket}/${pTeamName}/${pDatasetName}/${!dt}/
        StorageDescriptor:
          Location: !Sub s3://${pRawBucket}/${pTeamName}/${pDatasetName}/
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - Name: eventid
              Type: string
            - Name: datetime
              Type: string
            - Name: keyword
              Type: string
            - Name: category
              Type: string
            - Name: platform
              Type: string
            - Name: networktype
              Type: string
            - Name: userplansmap
              Type: array<string>
            - Name: proxy_isp
              Type: string
            - Name: user_id
              Type: string
        PartitionKeys:
          - Name: dt
            Type: string

  rCuratedSearchEventsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref pGlueDatabaseName
      TableInput:
        Name: curated
        Description: Curated OTT search events — 19-column enriched Parquet, partitioned by dt (yyyy-MM-dd)
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2022-01-01,NOW+1YEARS"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub s3://${pAnalyticsBucket}/${pTeamName}/${pDatasetName}/curated/dt=${!dt}/
        StorageDescriptor:
          Location: !Sub s3://${pAnalyticsBucket}/${pTeamName}/${pDatasetName}/curated/
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - Name: event_id
              Type: string
            - Name: event_ts
              Type: timestamp
            - Name: hour_of_day_vn
              Type: int
            - Name: user_id_hashed
              Type: string
            - Name: user_is_authenticated
              Type: boolean
            - Name: session_action
              Type: string
            - Name: is_search_abandoned
              Type: boolean
            - Name: keyword_norm
              Type: string
            - Name: platform_group
              Type: string
            - Name: network_type_norm
              Type: string
            - Name: isp_segment
              Type: string
            - Name: has_premium
              Type: boolean
            - Name: subscription_count
              Type: int
            - Name: plan_names
              Type: array<string>
            - Name: search_session_id
              Type: string
            - Name: is_repeat_search
              Type: boolean
            - Name: _pipeline_run_id
              Type: string
        PartitionKeys:
          - Name: dt
            Type: date

Outputs:
  oGlueJobName:
    Description: Glue job name
    Value: !Ref rGlueJob
    Export:
      Name: !Sub ${AWS::StackName}-glue-job-name

  oGlueRoleArn:
    Description: Glue IAM role ARN
    Value: !GetAtt rGlueRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-glue-role-arn

  oPipelineDeploymentInstance:
    Description: Pipeline deployment instance this job belongs to
    Value: !Ref pPipelineDeploymentInstance
