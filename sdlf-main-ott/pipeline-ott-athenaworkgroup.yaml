AWSTemplateFormatVersion: "2010-09-09"
Description: >
  OTT Athena workgroup — per-query 10 GB scan limit for cost isolation,
  KMS-encrypted results, and CloudWatch metrics for all OTT analytics queries.

Parameters:
  pPipelineReference:
    Type: String
    Default: none
  pStageBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rStageBucket/prod
  pKmsKeyArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rKMSKey/prod
  pBytesScannedCutoffPerQuery:
    Type: Number
    Default: 10737418240
    Description: Hard scan limit per query (bytes). Default 10 GB.

Resources:

  rOttWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: sdlf-ott
      Description: OTT analytics — 10 GB per-query scan cap, KMS-encrypted results
      State: ENABLED
      WorkGroupConfiguration:
        BytesScannedCutoffPerQuery: !Ref pBytesScannedCutoffPerQuery
        EnforceWorkGroupConfiguration: false
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub s3://${pStageBucket}/athena-results/workgroup/
          EncryptionConfiguration:
            EncryptionOption: SSE_KMS
            KmsKey: !Ref pKmsKeyArn

  rWorkgroupSsm:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /sdlf/athena/rWorkgroup/ott
      Type: String
      Value: !Ref rOttWorkgroup
      Description: OTT Athena workgroup name

Outputs:
  oPipelineReference:
    Description: CodePipeline reference this stack was deployed with
    Value: !Ref pPipelineReference
  oWorkgroupName:
    Description: Athena workgroup name
    Value: !Ref rOttWorkgroup
    Export:
      Name: !Sub ${AWS::StackName}-workgroup-name
