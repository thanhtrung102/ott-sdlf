AWSTemplateFormatVersion: "2010-09-09"
Description: >
  OTT Data Quality Stage — reusable; deployed twice:
  sdlf-pipeline-ott-dataquality (curated table after Stage B) and
  sdlf-pipeline-ott-goldquality (gold keyword_trends after Trending Lambda).

Parameters:
  pPipelineReference:
    Type: String
    Default: none
  pStageName:
    Type: String
    Description: Stage identifier used in all resource names (mainDQ or mainGoldDQ)
  pDatabaseName:
    Type: String
    Description: Glue catalog database name
  pTableName:
    Type: String
    Description: Glue table to run DQ on
  pRulesetName:
    Type: String
    Description: Glue DQ ruleset name (auto-created on first run)
  pCrawlerName:
    Type: String
    Description: Glue crawler to start after DQ evaluation passes
  pCrawlerRoleArn:
    Type: String
    Description: Crawler IAM role ARN for iam:PassRole
  pStageBucket:
    Type: String
    Description: Stage S3 bucket — DQ results written here
  pKmsKeyArn:
    Type: String
    Description: KMS key ARN for encryption
  pDataReadBucket:
    Type: String
    Description: S3 bucket the Glue DQ scan reads source data from
  pDataReadPrefix:
    Type: String
    Description: Prefix within pDataReadBucket for read access (no leading slash)
  pResultsS3Prefix:
    Type: String
    Description: Key prefix in pStageBucket for DQ result files (no trailing slash)
  pTriggerType:
    Type: String
    AllowedValues: [statesMachine, customEvent]
    Description: >
      statesMachine = triggered by Step Functions status change on Stage B;
      customEvent = triggered by a custom EventBridge event source
  pStageBSmArn:
    Type: String
    Default: ""
    Description: Stage B state machine ARN — required when pTriggerType=statesMachine
  pCustomEventSource:
    Type: String
    Default: ""
    Description: EventBridge source string — required when pTriggerType=customEvent
  pCustomEventDetailType:
    Type: String
    Default: ""
    Description: EventBridge detail-type — required when pTriggerType=customEvent
  pExportRoles:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Export execution and Glue role ARNs to SSM.
      Set true for the curated DQ instance, which the LF stack references.

Conditions:
  IsStatesMachineTrigger: !Equals [!Ref pTriggerType, statesMachine]
  ExportRoles: !Equals [!Ref pExportRoles, "true"]

Resources:

  ######## IAM ########

  rDQExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /sdlf-ott/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub states.${AWS::Region}.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: !Sub sdlf-ott-${pStageName}-sm
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - glue:StartDataQualityRuleRecommendationRun
                  - glue:GetDataQualityRuleRecommendationRun
                  - glue:StartDataQualityRulesetEvaluationRun
                  - glue:GetDataQualityRulesetEvaluationRun
                Resource: !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:dataQualityRuleset/*
              - Effect: Allow
                Action:
                  - glue:GetTable
                  - glue:GetDatabase
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${pDatabaseName}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${pDatabaseName}/*
              - Effect: Allow
                Action:
                  - glue:StartCrawler
                Resource: !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:crawler/${pCrawlerName}
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Ref pCrawlerRoleArn
                  - !GetAtt rGlueDQRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: glue.amazonaws.com
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutLogEvents
                  - logs:PutResourcePolicy
                  - logs:CreateLogGroup
                  - logs:DescribeLogGroups
                  - logs:DescribeResourcePolicies
                Resource: "*"
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"

  rGlueDQRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /sdlf-ott/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: !Sub sdlf-ott-${pStageName}-glue-dq-s3
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${pStageBucket}/${pResultsS3Prefix}/*
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${pStageBucket}
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${pDataReadBucket}/${pDataReadPrefix}*
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${pDataReadBucket}
              - Effect: Allow
                Action:
                  - glue:GetTable
                  - glue:GetDatabase
                  - glue:GetPartitions
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${pDatabaseName}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${pDatabaseName}/*
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !Ref pKmsKeyArn
              - Effect: Allow
                Action: lakeformation:GetDataAccess
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*

  rEventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /sdlf-ott/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub sdlf-ott-${pStageName}-eb-start-sm
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref rDQStateMachine

  ######## CLOUDWATCH LOGS ########

  rDQSmLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /sdlf/statemachine/ott-${pStageName}
      RetentionInDays: 30

  ######## STEP FUNCTIONS ########

  rDQStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub sdlf-ott-${pStageName}-sm
      RoleArn: !GetAtt rDQExecutionRole.Arn
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt rDQSmLogGroup.Arn
      TracingConfiguration:
        Enabled: true
      DefinitionString: !Sub
        - |
          {
            "Comment": "OTT ${pStageName} Data Quality on ${pDatabaseName}.${pTableName}",
            "StartAt": "StartRecommendationRun",
            "States": {
              "StartRecommendationRun": {
                "Type": "Task",
                "Resource": "arn:aws:states:::aws-sdk:glue:startDataQualityRuleRecommendationRun",
                "Parameters": {
                  "DataSource": {
                    "GlueTable": {
                      "DatabaseName": "${pDatabaseName}",
                      "TableName": "${pTableName}"
                    }
                  },
                  "CreatedRulesetName": "${pRulesetName}",
                  "Role": "${GlueDQRoleArn}",
                  "NumberOfWorkers": 5
                },
                "ResultPath": "$.recommendation_run",
                "Next": "WaitForRecommendation",
                "Catch": [
                  {
                    "ErrorEquals": ["Glue.InvalidInputException"],
                    "Comment": "Ruleset already exists - skip to evaluation",
                    "ResultPath": null,
                    "Next": "StartEvaluationRun"
                  }
                ]
              },
              "WaitForRecommendation": {
                "Type": "Wait",
                "Seconds": 60,
                "Next": "GetRecommendationStatus"
              },
              "GetRecommendationStatus": {
                "Type": "Task",
                "Resource": "arn:aws:states:::aws-sdk:glue:getDataQualityRuleRecommendationRun",
                "Parameters": {
                  "RunId.$": "$.recommendation_run.RunId"
                },
                "ResultPath": "$.recommendation_status",
                "Next": "RecommendationComplete"
              },
              "RecommendationComplete": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.recommendation_status.Status",
                    "StringEquals": "SUCCEEDED",
                    "Next": "StartEvaluationRun"
                  },
                  {
                    "Variable": "$.recommendation_status.Status",
                    "StringEquals": "FAILED",
                    "Next": "DQFailed"
                  }
                ],
                "Default": "WaitForRecommendation"
              },
              "StartEvaluationRun": {
                "Type": "Task",
                "Resource": "arn:aws:states:::aws-sdk:glue:startDataQualityRulesetEvaluationRun",
                "Parameters": {
                  "DataSource": {
                    "GlueTable": {
                      "DatabaseName": "${pDatabaseName}",
                      "TableName": "${pTableName}"
                    }
                  },
                  "Role": "${GlueDQRoleArn}",
                  "NumberOfWorkers": 5,
                  "RulesetNames": ["${pRulesetName}"],
                  "AdditionalRunOptions": {
                    "CloudWatchMetricsEnabled": true,
                    "ResultsS3Prefix": "s3://${pStageBucket}/${pResultsS3Prefix}/"
                  }
                },
                "ResultPath": "$.evaluation_run",
                "Next": "WaitForEvaluation"
              },
              "WaitForEvaluation": {
                "Type": "Wait",
                "Seconds": 60,
                "Next": "GetEvaluationStatus"
              },
              "GetEvaluationStatus": {
                "Type": "Task",
                "Resource": "arn:aws:states:::aws-sdk:glue:getDataQualityRulesetEvaluationRun",
                "Parameters": {
                  "RunId.$": "$.evaluation_run.RunId"
                },
                "ResultPath": "$.evaluation_status",
                "Next": "EvaluationComplete"
              },
              "EvaluationComplete": {
                "Type": "Choice",
                "Choices": [
                  {
                    "Variable": "$.evaluation_status.Status",
                    "StringEquals": "SUCCEEDED",
                    "Next": "StartCrawler"
                  },
                  {
                    "Variable": "$.evaluation_status.Status",
                    "StringEquals": "FAILED",
                    "Next": "DQFailed"
                  }
                ],
                "Default": "WaitForEvaluation"
              },
              "StartCrawler": {
                "Type": "Task",
                "Resource": "arn:aws:states:::aws-sdk:glue:startCrawler",
                "Parameters": {
                  "Name": "${pCrawlerName}"
                },
                "ResultPath": null,
                "Retry": [
                  {
                    "ErrorEquals": ["Glue.CrawlerRunningException"],
                    "IntervalSeconds": 30,
                    "MaxAttempts": 6,
                    "BackoffRate": 2
                  }
                ],
                "Next": "DQSucceeded"
              },
              "DQSucceeded": {
                "Type": "Succeed"
              },
              "DQFailed": {
                "Type": "Fail",
                "Error": "DataQualityCheckFailed",
                "Cause": "Glue DQ evaluation did not pass"
              }
            }
          }
        - GlueDQRoleArn: !GetAtt rGlueDQRole.Arn

  ######## EVENTBRIDGE ########

  rDQTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub sdlf-ott-${pStageName}-trigger
      Description: !Sub Start ${pStageName} DQ state machine
      EventPattern: !If
        - IsStatesMachineTrigger
        - !Sub '{"source":["aws.states"],"detail-type":["Step Functions Execution Status Change"],"detail":{"status":["SUCCEEDED"],"stateMachineArn":["${pStageBSmArn}"]}}'
        - !Sub '{"source":["${pCustomEventSource}"],"detail-type":["${pCustomEventDetailType}"]}'
      State: ENABLED
      Targets:
        - Id: !Sub sdlf-ott-${pStageName}-sm-target
          Arn: !Ref rDQStateMachine
          RoleArn: !GetAtt rEventBridgeRole.Arn

  ######## SSM ########

  rDQStateMachineSsm:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sdlf/pipeline/rStateMachine/ott-${pStageName}
      Type: String
      Value: !Ref rDQStateMachine
      Description: !Sub ARN of the OTT ${pStageName} Data Quality State Machine

  rDQExecRoleSsm:
    Condition: ExportRoles
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sdlf/pipeline/rRole/ott-${pStageName}Exec
      Type: String
      Value: !GetAtt rDQExecutionRole.Arn
      Description: !Sub DQ SM execution role ARN for ${pStageName} (used by LF stack)

  rDQGlueRoleSsm:
    Condition: ExportRoles
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /sdlf/pipeline/rRole/ott-${pStageName}Glue
      Type: String
      Value: !GetAtt rGlueDQRole.Arn
      Description: !Sub Glue DQ role ARN for ${pStageName} (used by LF stack)

Outputs:
  oPipelineReference:
    Value: !Ref pPipelineReference
  oDQStateMachineArn:
    Value: !Ref rDQStateMachine
