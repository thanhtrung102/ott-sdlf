AWSTemplateFormatVersion: "2010-09-09"
Description: >
  OTT LUT Refresh — automatically classifies UNKNOWN search keywords via
  Amazon Bedrock Nova Micro after the Data Quality SM succeeds, then rebuilds
  the genre_classifier_pkg.zip in the SDLF artifacts bucket so the next Glue
  run uses an enriched classifier without any manual intervention.
  Source: lambda/lut-refresh/src/lambda_function.py

Parameters:
  pPipelineReference:
    Type: String
    Default: none
  pDQSmArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/pipeline/rStateMachine/ott-mainDQ
  pArtifactsBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rArtifactsBucket/prod
  pStageBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rStageBucket/prod
  pDatabaseName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/dataset/rAnalyticsGlueDataCatalog/searchevents
  pBedrockModelId:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
  pMaxNewKeywords:
    Type: Number
    Default: 20000
    Description: Max new UNKNOWN keywords to classify per Lambda invocation
  pKmsKeyArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rKMSKey/prod
  pAthenaResultsBucket:
    Type: String
    Description: Bucket enforced by the sdlf-ott Athena workgroup for query results
  pAthenaWorkgroupKmsKey:
    Type: String
    Description: KMS key ARN used by the sdlf-ott Athena workgroup for SSE_KMS output encryption
  pProjectBucketKmsKeyArn:
    Type: String
    Description: KMS key ARN for ott-search-${ACCT}-prod (the Glue project bucket). Required so save_lut() can mirror the classifier zip into the SSE_KMS-encrypted project bucket.

Resources:

  ######## IAM ########

  rLutRefreshRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /sdlf-ott/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: sdlf-ott-lut-refresh
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sdlf-ott-mainLUT-refresh:*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pArtifactsBucket}/ott/searchevents/*
              # Mirror the refreshed classifier into the Glue project bucket so
              # the next Stage B run picks it up automatically. Closes the
              # two-bucket hand-off the workshop previously called out.
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::ott-search-${AWS::AccountId}-prod/ott/searchevents/*
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pStageBucket}
                  - !Sub arn:${AWS::Partition}:s3:::${pAthenaResultsBucket}
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pStageBucket}/athena-results/lut-refresh/*
                  - !Sub arn:${AWS::Partition}:s3:::${pAthenaResultsBucket}/*
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                Resource:
                  - !Sub arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/primary
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetPartitions
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${pDatabaseName}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${pDatabaseName}/*
              - Effect: Allow
                Action:
                  - lakeformation:GetDataAccess
                Resource: "*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - !Ref pKmsKeyArn
                  - !Ref pAthenaWorkgroupKmsKey
                  # Required for save_lut()'s mirror PutObject into the SSE_KMS
                  # project bucket ott-search-${ACCT}-prod (different key from
                  # the SDLF KMS used by the artifacts bucket).
                  - !Ref pProjectBucketKmsKeyArn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt rLutRefreshDlq.Arn
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"
        # The SDLF datalake-library Lambda layer resolves /SDLF*/ SSM
        # parameters at runtime. This grant was historically applied
        # out-of-band (put-role-policy); declared here so the role is fully
        # defined by this template — no reliance on imperative patching.
        - PolicyName: sdlf-ssm-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowSDLF2SSMRead
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/SDLF2/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sdlf/*
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/SDLF/*

  ######## SQS DLQ ########

  rLutRefreshDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: sdlf-ott-mainLUT-dlq
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: !Ref pKmsKeyArn

  rLutRefreshDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref rLutRefreshDlq
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeSendMessage
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt rLutRefreshDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt rLutRefreshTriggerRule.Arn

  ######## CLOUDWATCH LOGS ########

  rLutRefreshLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sdlf-ott-mainLUT-refresh
      RetentionInDays: 30

  ######## LAMBDA ########

  rLutRefreshFunction:
    Type: AWS::Lambda::Function
    DependsOn: rLutRefreshLogGroup
    Properties:
      FunctionName: sdlf-ott-mainLUT-refresh
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt rLutRefreshRole.Arn
      Timeout: 900
      MemorySize: 512
      TracingConfig:
        Mode: Active
      Layers:
        - "{{resolve:ssm:/SDLF/Lambda/LatestDatalakeLibraryLayer}}"
      Environment:
        Variables:
          ATHENA_DATABASE: !Ref pDatabaseName
          ATHENA_RESULTS: !Sub s3://${pStageBucket}/athena-results/lut-refresh/
          ARTIFACTS_BUCKET: !Ref pArtifactsBucket
          ARTIFACTS_KEY: ott/searchevents/genre_classifier_pkg.zip
          # save_lut() mirrors the refreshed zip here so the Glue ETL
          # picks it up on the next Stage B run (closes the broken loop
          # that previously required a manual copy).
          PROJECT_BUCKET: !Sub ott-search-${AWS::AccountId}-prod
          BEDROCK_MODEL_ID: !Ref pBedrockModelId
          MAX_NEW_KEYWORDS: !Ref pMaxNewKeywords
          BATCH_SIZE: "50"
          THROTTLE_SECONDS: "0.3"
          TEAM: ott
          PIPELINE: main
          PIPELINE_STAGE: LUTRefresh
      Code:
        S3Bucket: "{{resolve:ssm:/sdlf/storage/rArtifactsBucket/prod}}"
        S3Key: lambda/lutrefresh.zip
  rLutRefreshEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref rLutRefreshFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 1
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt rLutRefreshDlq.Arn

  rLutRefreshPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt rLutRefreshFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt rLutRefreshTriggerRule.Arn

  ######## EVENTBRIDGE ########

  rLutRefreshTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: sdlf-ott-mainLUT-trigger
      Description: Start LUT Refresh Lambda when DQ SM succeeds
      EventPattern: !Sub
        - '{"source":["aws.states"],"detail-type":["Step Functions Execution Status Change"],"detail":{"status":["SUCCEEDED"],"stateMachineArn":["${DQSmArn}"]}}'
        - DQSmArn: !Ref pDQSmArn
      State: ENABLED
      Targets:
        - Id: sdlf-ott-mainLUT-lambda-target
          Arn: !GetAtt rLutRefreshFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt rLutRefreshDlq.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 3600

  ######## SSM ########

  rLutRefreshFunctionSsm:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /sdlf/pipeline/rLambda/ott-mainLUT
      Type: String
      Value: !GetAtt rLutRefreshFunction.Arn
      Description: ARN of the OTT LUT Refresh Lambda

  rLutRefreshRoleSsm:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /sdlf/pipeline/rRole/ott-mainLUT
      Type: String
      Value: !GetAtt rLutRefreshRole.Arn
      Description: IAM role ARN for the OTT LUT Refresh Lambda (used by LF stack)

Outputs:
  oPipelineReference:
    Description: CodePipeline reference this stack has been deployed with
    Value: !Ref pPipelineReference
  oLutRefreshFunctionArn:
    Description: ARN of the LUT Refresh Lambda
    Value: !GetAtt rLutRefreshFunction.Arn
  oTriggerRuleArn:
    Description: EventBridge rule ARN
    Value: !GetAtt rLutRefreshTriggerRule.Arn
