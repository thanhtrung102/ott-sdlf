AWSTemplateFormatVersion: "2010-09-09"
Description: >
  OTT Trending Keywords — compares current-week search volumes against the same
  week four weeks prior to surface high-growth keywords after every DQ SM success.
  Writes trending_all.csv (all genres) and trending_unknown.csv (LUT priority
  targets) to the stage bucket. Degrades gracefully to volume-only when less than
  four weeks of pipeline data exists.
  Source: lambda/trending/src/lambda_function.py

Parameters:
  pPipelineReference:
    Type: String
    Default: none
  pDQSmArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/pipeline/rStateMachine/ott-mainDQ
  pStageBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rStageBucket/prod
  pDatabaseName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/dataset/rAnalyticsGlueDataCatalog/searchevents
  pSnsTopicArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /SDLF/SNS/ott/Notifications
  pMinGrowthMultiplier:
    Type: Number
    Default: 3
    Description: Minimum week-over-week growth multiplier to be considered trending
  pMinSearchVolume:
    Type: Number
    Default: 10
    Description: Minimum searches in current window to filter noise
  pDatalakeLibraryLayerArn:
    Type: String
    Default: arn:aws:lambda:ap-southeast-1:703668403514:layer:sdlf-DatalakeLibrary:8
    Description: ARN of the SDLF datalake library Lambda layer
  pKmsKeyArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rKMSKey/prod
  pGoldDatabaseName:
    Type: String
    Default: sdlf_ott_gold
    Description: Glue database for the gold keyword_trends table
  pGoldBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rStageBucket/prod
    Description: S3 bucket that holds the gold layer (may differ from stage bucket)
  pAthenaResultsBucket:
    Type: String
    Description: Bucket enforced by the sdlf-ott Athena workgroup for query results

Resources:

  ######## IAM ########

  rTrendingRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /sdlf-ott/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: sdlf-ott-trending
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sdlf-ott-mainTR-report:*
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pStageBucket}
                  - !Sub arn:${AWS::Partition}:s3:::${pAthenaResultsBucket}
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pStageBucket}/athena-results/trending/*
                  - !Sub arn:${AWS::Partition}:s3:::${pStageBucket}/analytics/trending/*
                  - !Sub arn:${AWS::Partition}:s3:::${pAthenaResultsBucket}/*
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                Resource:
                  - !Sub arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/sdlf-ott
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetPartitions
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${pDatabaseName}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${pDatabaseName}/*
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:CreateTable
                  - glue:DeleteTable
                  - glue:UpdateTable
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${pGoldDatabaseName}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${pGoldDatabaseName}/*
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pGoldBucket}
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pGoldBucket}/ott/searchevents/gold/*
              - Effect: Allow
                Action:
                  - lakeformation:GetDataAccess
                Resource: "*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - !Ref pKmsKeyArn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref pSnsTopicArn
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt rTrendingDlq.Arn

  ######## SQS DLQ ########

  rTrendingDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: sdlf-ott-mainTR-dlq
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: !Ref pKmsKeyArn

  ######## CLOUDWATCH LOGS ########

  rTrendingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sdlf-ott-mainTR-report
      RetentionInDays: 30

  ######## LAMBDA ########

  rTrendingFunction:
    Type: AWS::Lambda::Function
    DependsOn: rTrendingLogGroup
    Properties:
      FunctionName: sdlf-ott-mainTR-report
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt rTrendingRole.Arn
      Timeout: 300
      MemorySize: 256
      Layers:
        - !Ref pDatalakeLibraryLayerArn
      Environment:
        Variables:
          ATHENA_DATABASE: !Ref pDatabaseName
          ATHENA_RESULTS: !Sub s3://${pStageBucket}/athena-results/trending/
          STAGE_BUCKET: !Ref pStageBucket
          ANALYTICS_PREFIX: analytics/trending/
          SNS_TOPIC_ARN: !Ref pSnsTopicArn
          MIN_GROWTH_MULTIPLIER: !Sub "${pMinGrowthMultiplier}"
          MIN_SEARCH_VOLUME: !Sub "${pMinSearchVolume}"
          GOLD_DATABASE: !Ref pGoldDatabaseName
          GOLD_LOCATION: !Sub s3://${pGoldBucket}/ott/searchevents/gold/keyword_trends/
          ATHENA_WORKGROUP: sdlf-ott
          TEAM: ott
          PIPELINE: main
          PIPELINE_STAGE: Trending
      Code:
        ZipFile: |
          # Source of truth: lambda/trending/src/lambda_function.py
          # Kept inline for self-contained CFN deployment.
          # Update both files together when making code changes.
          import csv, io, json, os, time
          from datetime import date, timedelta
          import boto3
          from datalake_library.commons import init_logger

          logger = init_logger(__name__)
          athena  = boto3.client("athena")
          s3      = boto3.client("s3")
          sns     = boto3.client("sns")
          events  = boto3.client("events")

          DB               = os.environ["ATHENA_DATABASE"]
          RESULTS          = os.environ["ATHENA_RESULTS"]
          STAGE_BUCKET     = os.environ["STAGE_BUCKET"]
          ANALYTICS_PREFIX = os.environ["ANALYTICS_PREFIX"]
          SNS_TOPIC_ARN    = os.environ["SNS_TOPIC_ARN"]
          MIN_GROWTH       = float(os.environ["MIN_GROWTH_MULTIPLIER"])
          MIN_VOLUME       = int(os.environ["MIN_SEARCH_VOLUME"])
          WORKGROUP        = os.environ.get("ATHENA_WORKGROUP", "sdlf-ott")

          _TRENDING_SQL = """
          WITH current_window AS (
              SELECT keyword_norm, derived_genre, COUNT(*) AS current_cnt
              FROM {db}.curated
              WHERE dt >= '{cur_start}' AND dt < '{cur_end}'
              GROUP BY keyword_norm, derived_genre
          ),
          baseline_window AS (
              SELECT keyword_norm, derived_genre, COUNT(*) AS baseline_cnt
              FROM {db}.curated
              WHERE dt >= '{base_start}' AND dt < '{base_end}'
              GROUP BY keyword_norm, derived_genre
          )
          SELECT c.keyword_norm, c.derived_genre, c.current_cnt,
                 COALESCE(b.baseline_cnt, 0) AS baseline_cnt,
                 CASE WHEN COALESCE(b.baseline_cnt, 0) = 0 THEN NULL
                      ELSE ROUND(CAST(c.current_cnt AS double) / b.baseline_cnt, 2)
                 END AS growth_multiplier,
                 CASE WHEN b.baseline_cnt IS NULL THEN 'true' ELSE 'false' END AS is_new_keyword
          FROM current_window c
          LEFT JOIN baseline_window b ON c.keyword_norm = b.keyword_norm AND c.derived_genre = b.derived_genre
          WHERE c.current_cnt >= {min_volume}
            AND (b.baseline_cnt IS NULL OR CAST(c.current_cnt AS double) / b.baseline_cnt >= {min_growth})
          {genre_filter}
          ORDER BY c.current_cnt DESC LIMIT 1000
          """

          _FALLBACK_SQL = """
          SELECT keyword_norm, derived_genre, COUNT(*) AS current_cnt,
                 0 AS baseline_cnt, NULL AS growth_multiplier, 'true' AS is_new_keyword
          FROM {db}.curated
          WHERE dt >= '{cur_start}' AND dt < '{cur_end}'
          {genre_filter}
          GROUP BY keyword_norm, derived_genre
          HAVING COUNT(*) >= {min_volume}
          ORDER BY current_cnt DESC LIMIT 1000
          """

          _GOLD_DROP_SQL = "DROP TABLE IF EXISTS {gold_db}.keyword_trends"

          _GOLD_CTAS_SQL = """
          CREATE TABLE {gold_db}.keyword_trends
          WITH (format='PARQUET', parquet_compression='SNAPPY', external_location='{gold_location}')
          AS
          WITH agg AS (
              SELECT keyword_norm, platform_group, derived_genre, dt AS trend_date,
                     CAST(COUNT(*) AS bigint) AS search_count,
                     CAST(SUM(CASE WHEN session_action='enter' THEN 1 ELSE 0 END) AS bigint) AS enter_count,
                     CAST(SUM(CASE WHEN is_search_abandoned THEN 1 ELSE 0 END) AS bigint) AS abandoned_count,
                     ROUND(CAST(SUM(CASE WHEN is_search_abandoned THEN 1 ELSE 0 END) AS double)/CAST(COUNT(*) AS double),4) AS abandonment_rate,
                     CAST(COUNT(DISTINCT user_id_hashed) AS bigint) AS unique_users
              FROM {curated_db}.curated
              GROUP BY keyword_norm, platform_group, derived_genre, dt
              HAVING COUNT(*) >= {min_volume}
          ),
          ranked AS (
              SELECT *, CAST(RANK() OVER (PARTITION BY platform_group, derived_genre, trend_date ORDER BY search_count DESC) AS integer) AS rank_today
              FROM agg
          ),
          prev_agg AS (
              SELECT keyword_norm, platform_group, derived_genre, dt AS trend_date_7d,
                     CAST(RANK() OVER (PARTITION BY platform_group, derived_genre, dt ORDER BY COUNT(*) DESC) AS integer) AS rank_prev
              FROM {curated_db}.curated
              GROUP BY keyword_norm, platform_group, derived_genre, dt
              HAVING COUNT(*) >= {min_volume}
          )
          SELECT r.keyword_norm, r.platform_group, r.derived_genre,
                 r.search_count, r.enter_count, r.abandoned_count, r.abandonment_rate, r.unique_users,
                 r.rank_today, COALESCE(p.rank_prev,-1) AS rank_7d_ago,
                 CASE WHEN p.rank_prev IS NULL THEN true ELSE false END AS is_new_entrant,
                 COALESCE(p.rank_prev - r.rank_today, 0) AS rank_delta, r.trend_date
          FROM ranked r
          LEFT JOIN prev_agg p ON r.keyword_norm=p.keyword_norm AND r.platform_group=p.platform_group
                                AND r.derived_genre=p.derived_genre
                                AND date_diff('day', date(p.trend_date_7d), date(r.trend_date))=7
          """

          def athena_query(sql):
              r = athena.start_query_execution(
                  QueryString=sql, QueryExecutionContext={"Database": DB},
                  ResultConfiguration={"OutputLocation": RESULTS},
                  WorkGroup=WORKGROUP,
              )
              qid = r["QueryExecutionId"]
              while True:
                  st = athena.get_query_execution(QueryExecutionId=qid)["QueryExecution"]["Status"]["State"]
                  if st == "SUCCEEDED": break
                  if st in ("FAILED","CANCELLED"): raise RuntimeError(f"Athena query {st}: {qid}")
                  time.sleep(3)
              headers, rows = None, []
              for page in athena.get_paginator("get_query_results").paginate(QueryExecutionId=qid):
                  for row in page["ResultSet"]["Rows"]:
                      values = [col.get("VarCharValue","") for col in row["Data"]]
                      if headers is None: headers = values; continue
                      rows.append(dict(zip(headers, values)))
              return headers or [], rows

          def athena_ddl(sql):
              r = athena.start_query_execution(QueryString=sql, ResultConfiguration={"OutputLocation": RESULTS}, WorkGroup=WORKGROUP)
              qid = r["QueryExecutionId"]
              while True:
                  st = athena.get_query_execution(QueryExecutionId=qid)["QueryExecution"]["Status"]["State"]
                  if st == "SUCCEEDED": return
                  if st in ("FAILED","CANCELLED"): raise RuntimeError(f"DDL {st}: {qid}")
                  time.sleep(3)

          def write_csv(key, headers, rows):
              buf = io.StringIO()
              writer = csv.DictWriter(buf, fieldnames=headers)
              writer.writeheader(); writer.writerows(rows)
              s3.put_object(Bucket=STAGE_BUCKET, Key=key, Body=buf.getvalue().encode("utf-8"), ContentType="text/csv")
              logger.info(f"Wrote {len(rows)} rows -> s3://{STAGE_BUCKET}/{key}")
              return len(rows)

          def latest_dt():
              _, rows = athena_query(f"SELECT MAX(dt) AS max_dt FROM {DB}.curated")
              val = rows[0].get("max_dt", "") if rows else ""
              if not val:
                  raise RuntimeError("curated table has no data")
              return date.fromisoformat(val)

          def has_baseline_data(base_start, base_end):
              sql = f"SELECT COUNT(*) AS cnt FROM {DB}.curated WHERE dt >= '{base_start}' AND dt < '{base_end}'"
              _, rows = athena_query(sql)
              return rows and int(rows[0].get("cnt", 0)) > 0

          def write_gold_table():
              gold_db = os.environ.get("GOLD_DATABASE", "sdlf_ott_gold")
              gold_location = os.environ.get("GOLD_LOCATION", "")
              if not gold_location:
                  logger.warning("GOLD_LOCATION not set — skipping gold table write")
                  return 0
              athena_ddl(_GOLD_DROP_SQL.format(gold_db=gold_db))
              athena_ddl(_GOLD_CTAS_SQL.format(gold_db=gold_db, gold_location=gold_location, curated_db=DB, min_volume=MIN_VOLUME))
              _, count_rows = athena_query(f"SELECT COUNT(*) AS cnt FROM {gold_db}.keyword_trends")
              count = int(count_rows[0]["cnt"]) if count_rows else 0
              logger.info(f"Gold table written: {count} rows")
              return count

          def run_query(cur_start, cur_end, base_start, base_end, use_fallback, genre_filter=""):
              if use_fallback:
                  sql = _FALLBACK_SQL.format(db=DB, cur_start=cur_start, cur_end=cur_end, min_volume=MIN_VOLUME, genre_filter=genre_filter)
              else:
                  sql = _TRENDING_SQL.format(db=DB, cur_start=cur_start, cur_end=cur_end, base_start=base_start, base_end=base_end, min_volume=MIN_VOLUME, min_growth=MIN_GROWTH, genre_filter=genre_filter)
              return athena_query(sql)

          def lambda_handler(event, context):
              logger.info(f"Trending report triggered — source: {event.get('source','?')} detail-type: {event.get('detail-type','?')}")
              ref = event.get("reference_date")
              today = date.fromisoformat(ref) if ref else latest_dt()
              cur_start  = str(today - timedelta(days=7))
              cur_end    = str(today)
              base_start = str(today - timedelta(days=35))
              base_end   = str(today - timedelta(days=28))
              dt = str(today)
              prefix = f"{ANALYTICS_PREFIX}{dt}/"
              use_fallback = not has_baseline_data(base_start, base_end)
              if use_fallback: logger.warning("No baseline data — using volume-only fallback")
              summary, errors = {}, 0
              for name, gf in [("trending_all", ""), ("trending_unknown", "AND c.derived_genre = 'UNKNOWN'" if not use_fallback else "AND derived_genre = 'UNKNOWN'")]:
                  try:
                      headers, rows = run_query(cur_start, cur_end, base_start, base_end, use_fallback, gf)
                      summary[name] = write_csv(f"{prefix}{name}.csv", headers, rows)
                  except Exception as e:
                      logger.error(f"{name} failed: {e}"); summary[name] = -1; errors += 1
              try:
                  summary["gold_rows"] = write_gold_table()
              except Exception as e:
                  logger.error(f"Gold table write failed: {e}"); summary["gold_rows"] = -1; errors += 1
              mode = "fallback/volume-only" if use_fallback else f"growth >={MIN_GROWTH}x"
              message = (
                  f"OTT Trending Keywords Report — {dt}\nMode: {mode}\n"
                  f"Trending keywords (all genres): {summary.get('trending_all',0)}\n"
                  f"Trending UNKNOWN (LUT targets): {summary.get('trending_unknown',0)}\n"
                  f"Gold table rows written: {summary.get('gold_rows',0)}\n"
                  f"Reports: s3://{STAGE_BUCKET}/{prefix}\nErrors: {errors}"
              )
              sns.publish(TopicArn=SNS_TOPIC_ARN, Subject=f"OTT Trending Keywords Report {dt}", Message=message)
              result = {"dt": dt, "mode": mode, "reports": summary, "prefix": f"s3://{STAGE_BUCKET}/{prefix}", "errors": errors}
              events.put_events(Entries=[{"Source": "sdlf.ott.trending", "DetailType": "Trending Report Completed", "Detail": json.dumps(result)}])
              logger.info(f"Trending complete — all:{summary.get('trending_all',0)} unknown:{summary.get('trending_unknown',0)} gold:{summary.get('gold_rows',0)} errors:{errors}")
              return result

  rTrendingEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref rTrendingFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 1
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt rTrendingDlq.Arn

  rTrendingPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt rTrendingFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt rTrendingTriggerRule.Arn

  ######## EVENTBRIDGE ########

  rTrendingTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: sdlf-ott-mainTR-trigger
      Description: Start Trending Lambda when DQ SM succeeds
      EventPattern: !Sub
        - '{"source":["aws.states"],"detail-type":["Step Functions Execution Status Change"],"detail":{"status":["SUCCEEDED"],"stateMachineArn":["${DQSmArn}"]}}'
        - DQSmArn: !Ref pDQSmArn
      State: ENABLED
      Targets:
        - Id: sdlf-ott-mainTR-lambda-target
          Arn: !GetAtt rTrendingFunction.Arn

  ######## SSM ########

  rTrendingFunctionSsm:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /sdlf/pipeline/rLambda/ott-mainTR
      Type: String
      Value: !GetAtt rTrendingFunction.Arn
      Description: ARN of the OTT Trending Keywords Lambda

  rTrendingRoleSsm:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /sdlf/pipeline/rRole/ott-mainTR
      Type: String
      Value: !GetAtt rTrendingRole.Arn
      Description: IAM role ARN for the OTT Trending Lambda (used by LF stack)

Outputs:
  oPipelineReference:
    Description: CodePipeline reference this stack has been deployed with
    Value: !Ref pPipelineReference
  oTrendingFunctionArn:
    Description: ARN of the Trending Keywords Lambda
    Value: !GetAtt rTrendingFunction.Arn
  oTriggerRuleArn:
    Description: EventBridge rule ARN
    Value: !GetAtt rTrendingTriggerRule.Arn
