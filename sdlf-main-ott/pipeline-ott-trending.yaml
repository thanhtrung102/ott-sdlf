AWSTemplateFormatVersion: "2010-09-09"
Description: >
  OTT Trending Keywords — compares current-week search volumes against the same
  week four weeks prior to surface high-growth keywords after every DQ SM success.
  Writes trending_all.csv (all genres) and trending_unknown.csv (LUT priority
  targets) to the stage bucket. Degrades gracefully to volume-only when less than
  four weeks of pipeline data exists.
  Source: lambda/trending/src/lambda_function.py

Parameters:
  pPipelineReference:
    Type: String
    Default: none
  pDQSmArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/pipeline/rStateMachine/ott-mainDQ
  pStageBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rStageBucket/prod
  pDatabaseName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/dataset/rAnalyticsGlueDataCatalog/searchevents
  pSnsTopicArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /SDLF/SNS/ott/Notifications
  pMinGrowthMultiplier:
    Type: Number
    Default: 3
    Description: Minimum week-over-week growth multiplier to be considered trending
  pMinSearchVolume:
    Type: Number
    Default: 10
    Description: Minimum searches in current window to filter noise
  pMaxTrendingRows:
    Type: Number
    Default: 1000
    Description: Hard cap on rows returned by the trending Athena query (LIMIT clause)
  pKmsKeyArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rKMSKey/prod
  pGoldDatabaseName:
    Type: String
    Default: fpt_ott_searchevents_gold
    Description: Glue database for the gold keyword_trends table
  pGoldBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rAnalyticsBucket/prod
    Description: S3 bucket that holds the gold layer
  pAthenaResultsBucket:
    Type: String
    Description: Bucket enforced by the sdlf-ott Athena workgroup for query results
  pAthenaWorkgroupKmsKey:
    Type: String
    Description: KMS key ARN used by the sdlf-ott Athena workgroup for SSE_KMS output encryption

Resources:

  ######## IAM ########

  rTrendingRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /sdlf-ott/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: sdlf-ott-trending
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sdlf-ott-mainTR-report:*
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pStageBucket}
                  - !Sub arn:${AWS::Partition}:s3:::${pAthenaResultsBucket}
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pStageBucket}/athena-results/trending/*
                  - !Sub arn:${AWS::Partition}:s3:::${pStageBucket}/analytics/trending/*
                  - !Sub arn:${AWS::Partition}:s3:::${pAthenaResultsBucket}/*
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                Resource:
                  - !Sub arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/sdlf-ott
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetPartitions
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${pDatabaseName}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${pDatabaseName}/*
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetPartitions
                  - glue:CreateTable
                  - glue:DeleteTable
                  - glue:UpdateTable
                  - glue:BatchCreatePartition
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${pGoldDatabaseName}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${pGoldDatabaseName}/*
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pGoldBucket}
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pGoldBucket}/ott/searchevents/gold/*
              # write_dashboard() publishes index.html to the CloudFront-fronted
              # dashboard bucket (sdlf-pipeline-ott-dashboard) after every run.
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::fpt-ott-${AWS::Region}-${AWS::AccountId}-dashboard-prod/*
              - Effect: Allow
                Action:
                  - lakeformation:GetDataAccess
                Resource: "*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - !Ref pKmsKeyArn
                  - !Ref pAthenaWorkgroupKmsKey
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref pSnsTopicArn
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt rTrendingDlq.Arn
              # X-Ray active tracing — surfaces Lambda→Athena→S3 hops in the trace.
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  ######## SQS DLQ ########

  rTrendingDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: sdlf-ott-mainTR-dlq
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: !Ref pKmsKeyArn

  # Allows EventBridge to write to the DLQ when it can't reach the Lambda
  # (throttling, IAM lag, transient AWS-side failures). The Lambda's own
  # OnFailure also writes here for post-execution failures; one queue, both
  # producers, single alarm (sdlf-ott-mainTR-dlq-not-empty).
  rTrendingDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref rTrendingDlq
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeSendMessage
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt rTrendingDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt rTrendingTriggerRule.Arn

  ######## CLOUDWATCH LOGS ########

  rTrendingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sdlf-ott-mainTR-report
      RetentionInDays: 30

  ######## LAMBDA ########

  rTrendingFunction:
    Type: AWS::Lambda::Function
    DependsOn: rTrendingLogGroup
    Properties:
      FunctionName: sdlf-ott-mainTR-report
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt rTrendingRole.Arn
      Timeout: 300
      MemorySize: 256
      TracingConfig:
        Mode: Active
      Layers:
        - "{{resolve:ssm:/SDLF/Lambda/LatestDatalakeLibraryLayer}}"
      Environment:
        Variables:
          ATHENA_DATABASE: !Ref pDatabaseName
          ATHENA_RESULTS: !Sub s3://${pStageBucket}/athena-results/trending/
          STAGE_BUCKET: !Ref pStageBucket
          ANALYTICS_PREFIX: analytics/trending/
          SNS_TOPIC_ARN: !Ref pSnsTopicArn
          MIN_GROWTH_MULTIPLIER: !Sub "${pMinGrowthMultiplier}"
          MIN_SEARCH_VOLUME: !Sub "${pMinSearchVolume}"
          MAX_TRENDING_ROWS: !Sub "${pMaxTrendingRows}"
          GOLD_DATABASE: !Ref pGoldDatabaseName
          GOLD_LOCATION: !Sub s3://${pGoldBucket}/ott/searchevents/gold/keyword_trends/
          DASHBOARD_BUCKET: !Sub fpt-ott-${AWS::Region}-${AWS::AccountId}-dashboard-prod
          ATHENA_WORKGROUP: sdlf-ott
          TEAM: ott
          PIPELINE: main
          PIPELINE_STAGE: Trending
      Code:
        S3Bucket: "{{resolve:ssm:/sdlf/storage/rArtifactsBucket/prod}}"
        S3Key: lambda/trending.zip
  rTrendingEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref rTrendingFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 1
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt rTrendingDlq.Arn

  rTrendingPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt rTrendingFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt rTrendingTriggerRule.Arn

  ######## EVENTBRIDGE ########

  rTrendingTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: sdlf-ott-mainTR-trigger
      Description: Start Trending Lambda when DQ SM succeeds
      EventPattern: !Sub
        - '{"source":["aws.states"],"detail-type":["Step Functions Execution Status Change"],"detail":{"status":["SUCCEEDED"],"stateMachineArn":["${DQSmArn}"]}}'
        - DQSmArn: !Ref pDQSmArn
      State: ENABLED
      Targets:
        - Id: sdlf-ott-mainTR-lambda-target
          Arn: !GetAtt rTrendingFunction.Arn
          # EventBridge → Lambda transit-failure surface (separate from
          # Lambda OnFailure, which catches post-execution failures).
          DeadLetterConfig:
            Arn: !GetAtt rTrendingDlq.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 3600

  ######## SSM ########

  rTrendingFunctionSsm:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /sdlf/pipeline/rLambda/ott-mainTR
      Type: String
      Value: !GetAtt rTrendingFunction.Arn
      Description: ARN of the OTT Trending Keywords Lambda

  rTrendingRoleSsm:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /sdlf/pipeline/rRole/ott-mainTR
      Type: String
      Value: !GetAtt rTrendingRole.Arn
      Description: IAM role ARN for the OTT Trending Lambda (used by LF stack)

  ######## GLUE CATALOG ########

  rGoldDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref pGoldDatabaseName
        Description: Gold layer — ranked keyword trends for the OTT search pipeline

  rTrendingAllTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref pDatabaseName
      TableInput:
        Name: trending_all
        Description: Trending keywords (all genres) — date-partitioned CSV from Trending Lambda
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: csv
          skip.header.line.count: "1"
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2022-01-01,NOW+1YEARS"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub s3://${pStageBucket}/analytics/trending/all/${!dt}/
        StorageDescriptor:
          Location: !Sub s3://${pStageBucket}/analytics/trending/all/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ","
              serialization.format: ","
          Columns:
            - Name: keyword_norm
              Type: string
            - Name: derived_genre
              Type: string
            - Name: current_cnt
              Type: bigint
            - Name: baseline_cnt
              Type: bigint
            - Name: growth_multiplier
              Type: double
            - Name: is_new_keyword
              Type: boolean
        PartitionKeys:
          - Name: dt
            Type: date

  rTrendingUnknownTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref pDatabaseName
      TableInput:
        Name: trending_unknown
        Description: Trending UNKNOWN-genre keywords — LUT refresh priority targets
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: csv
          skip.header.line.count: "1"
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2022-01-01,NOW+1YEARS"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub s3://${pStageBucket}/analytics/trending/unknown/${!dt}/
        StorageDescriptor:
          Location: !Sub s3://${pStageBucket}/analytics/trending/unknown/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ","
              serialization.format: ","
          Columns:
            - Name: keyword_norm
              Type: string
            - Name: derived_genre
              Type: string
            - Name: current_cnt
              Type: bigint
            - Name: baseline_cnt
              Type: bigint
            - Name: growth_multiplier
              Type: double
            - Name: is_new_keyword
              Type: boolean
        PartitionKeys:
          - Name: dt
            Type: date

  rKeywordTrendsTable:
    Type: AWS::Glue::Table
    DependsOn: rGoldDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref pGoldDatabaseName
      TableInput:
        Name: keyword_trends
        Description: Gold-layer keyword rankings — per-keyword×platform×genre×date, partitioned by trend_date
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: "true"
          projection.trend_date.type: date
          projection.trend_date.format: yyyy-MM-dd
          projection.trend_date.range: "2022-06-01,2022-09-01"
          projection.trend_date.interval: "1"
          projection.trend_date.interval.unit: DAYS
          storage.location.template: !Sub s3://${pGoldBucket}/ott/searchevents/gold/keyword_trends/trend_date=${!trend_date}/
        StorageDescriptor:
          Location: !Sub s3://${pGoldBucket}/ott/searchevents/gold/keyword_trends/
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            - Name: keyword_norm
              Type: string
            - Name: platform_group
              Type: string
            - Name: derived_genre
              Type: string
            - Name: search_count
              Type: bigint
            - Name: enter_count
              Type: bigint
            - Name: abandoned_count
              Type: bigint
            - Name: abandon_rate_pct
              Type: double
            - Name: unique_users
              Type: bigint
            - Name: rank_today
              Type: int
            - Name: rank_7d_ago
              Type: int
            - Name: is_new_entrant
              Type: boolean
            - Name: rank_improvement
              Type: int
        PartitionKeys:
          - Name: trend_date
            Type: date

Outputs:
  oPipelineReference:
    Description: CodePipeline reference this stack has been deployed with
    Value: !Ref pPipelineReference
  oTrendingFunctionArn:
    Description: ARN of the Trending Keywords Lambda
    Value: !GetAtt rTrendingFunction.Arn
  oTriggerRuleArn:
    Description: EventBridge rule ARN
    Value: !GetAtt rTrendingTriggerRule.Arn
