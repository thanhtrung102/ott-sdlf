AWSTemplateFormatVersion: "2010-09-09"
Description: >
  OTT Content Gap — runs five Athena analytics queries after the Data Quality SM
  succeeds, writes CSV reports to the stage bucket, and publishes a summary to SNS.
  Reports cover: abandoned keyword gaps, genre demand share, premium vs free demand,
  repeat search frustration, and platform demand breakdown.
  Source: lambda/content-gap/src/lambda_function.py

Parameters:
  pPipelineReference:
    Type: String
    Default: none
  pDQSmArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/pipeline/rStateMachine/ott-mainDQ
  pStageBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rStageBucket/prod
  pDatabaseName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/dataset/rAnalyticsGlueDataCatalog/searchevents
  pSnsTopicArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /SDLF/SNS/ott/Notifications
  pKmsKeyArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /sdlf/storage/rKMSKey/prod
  pAthenaResultsBucket:
    Type: String
    Description: Bucket enforced by the sdlf-ott Athena workgroup for query results
  pAthenaWorkgroupKmsKey:
    Type: String
    Description: KMS key ARN used by the sdlf-ott Athena workgroup for SSE_KMS output encryption

Resources:

  ######## IAM ########

  rContentGapRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /sdlf-ott/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: sdlf-ott-content-gap
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sdlf-ott-mainCG-report:*
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pStageBucket}
                  - !Sub arn:${AWS::Partition}:s3:::${pAthenaResultsBucket}
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${pStageBucket}/athena-results/content-gap/*
                  - !Sub arn:${AWS::Partition}:s3:::${pStageBucket}/analytics/content-gap/*
                  - !Sub arn:${AWS::Partition}:s3:::${pAthenaResultsBucket}/*
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                Resource:
                  - !Sub arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/sdlf-ott
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetPartitions
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${pDatabaseName}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${pDatabaseName}/*
              - Effect: Allow
                Action:
                  - lakeformation:GetDataAccess
                Resource: "*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - !Ref pKmsKeyArn
                  - !Ref pAthenaWorkgroupKmsKey
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref pSnsTopicArn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt rContentGapDlq.Arn
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  ######## SQS DLQ ########

  rContentGapDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: sdlf-ott-mainCG-dlq
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: !Ref pKmsKeyArn

  rContentGapDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref rContentGapDlq
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeSendMessage
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt rContentGapDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt rContentGapTriggerRule.Arn

  ######## CLOUDWATCH LOGS ########

  rContentGapLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sdlf-ott-mainCG-report
      RetentionInDays: 30

  ######## LAMBDA ########

  rContentGapFunction:
    Type: AWS::Lambda::Function
    DependsOn: rContentGapLogGroup
    Properties:
      FunctionName: sdlf-ott-mainCG-report
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt rContentGapRole.Arn
      Timeout: 600
      MemorySize: 256
      TracingConfig:
        Mode: Active
      Layers:
        - "{{resolve:ssm:/SDLF/Lambda/LatestDatalakeLibraryLayer}}"
      Environment:
        Variables:
          ATHENA_DATABASE: !Ref pDatabaseName
          ATHENA_RESULTS: !Sub s3://${pStageBucket}/athena-results/content-gap/
          STAGE_BUCKET: !Ref pStageBucket
          ANALYTICS_PREFIX: analytics/content-gap/
          SNS_TOPIC_ARN: !Ref pSnsTopicArn
          REPORT_PRESIGN_TTL_SECONDS: "604800"
          ATHENA_WORKGROUP: sdlf-ott
          TEAM: ott
          PIPELINE: main
          PIPELINE_STAGE: ContentGap
      Code:
        S3Bucket: "{{resolve:ssm:/sdlf/storage/rArtifactsBucket/prod}}"
        S3Key: lambda/contentgap.zip
  rContentGapEventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref rContentGapFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 1
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt rContentGapDlq.Arn

  rContentGapPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt rContentGapFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt rContentGapTriggerRule.Arn

  ######## EVENTBRIDGE ########

  rContentGapTriggerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: sdlf-ott-mainCG-trigger
      Description: Start Content Gap Lambda when DQ SM succeeds
      EventPattern: !Sub
        - '{"source":["aws.states"],"detail-type":["Step Functions Execution Status Change"],"detail":{"status":["SUCCEEDED"],"stateMachineArn":["${DQSmArn}"]}}'
        - DQSmArn: !Ref pDQSmArn
      State: ENABLED
      Targets:
        - Id: sdlf-ott-mainCG-lambda-target
          Arn: !GetAtt rContentGapFunction.Arn
          DeadLetterConfig:
            Arn: !GetAtt rContentGapDlq.Arn
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 3600

  ######## SSM ########

  rContentGapFunctionSsm:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /sdlf/pipeline/rLambda/ott-mainCG
      Type: String
      Value: !GetAtt rContentGapFunction.Arn
      Description: ARN of the OTT Content Gap Lambda

  rContentGapRoleSsm:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /sdlf/pipeline/rRole/ott-mainCG
      Type: String
      Value: !GetAtt rContentGapRole.Arn
      Description: IAM role ARN for the OTT Content Gap Lambda (used by LF stack)

  ######## GLUE CATALOG ########

  rContentGapsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref pDatabaseName
      TableInput:
        Name: content_gaps
        Description: Abandoned keyword content gaps — date-partitioned CSV from Content Gap Lambda
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: csv
          skip.header.line.count: "1"
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2022-01-01,NOW+1YEARS"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub s3://${pStageBucket}/analytics/content-gap/content_gaps/${!dt}/
        StorageDescriptor:
          Location: !Sub s3://${pStageBucket}/analytics/content-gap/content_gaps/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ","
              serialization.format: ","
          Columns:
            - Name: keyword_norm
              Type: string
            - Name: derived_genre
              Type: string
            - Name: searches
              Type: bigint
            - Name: abandoned
              Type: bigint
            - Name: abandon_rate_pct
              Type: double
        PartitionKeys:
          - Name: dt
            Type: date

  rPremiumVsFreeTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref pDatabaseName
      TableInput:
        Name: premium_vs_free
        Description: Premium vs free demand share by genre — date-partitioned CSV from Content Gap Lambda
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: csv
          skip.header.line.count: "1"
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2022-01-01,NOW+1YEARS"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub s3://${pStageBucket}/analytics/content-gap/premium_vs_free/${!dt}/
        StorageDescriptor:
          Location: !Sub s3://${pStageBucket}/analytics/content-gap/premium_vs_free/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ","
              serialization.format: ","
          Columns:
            - Name: derived_genre
              Type: string
            - Name: total_searches
              Type: bigint
            - Name: premium_searches
              Type: bigint
            - Name: free_searches
              Type: bigint
            - Name: premium_share_pct
              Type: double
        PartitionKeys:
          - Name: dt
            Type: date

  rRepeatSearchRateTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref pDatabaseName
      TableInput:
        Name: repeat_search_rate
        Description: Repeat search frustration rate by genre — date-partitioned CSV from Content Gap Lambda
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: csv
          skip.header.line.count: "1"
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2022-01-01,NOW+1YEARS"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub s3://${pStageBucket}/analytics/content-gap/repeat_search_rate/${!dt}/
        StorageDescriptor:
          Location: !Sub s3://${pStageBucket}/analytics/content-gap/repeat_search_rate/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ","
              serialization.format: ","
          Columns:
            - Name: derived_genre
              Type: string
            - Name: total_searches
              Type: bigint
            - Name: repeat_searches
              Type: bigint
            - Name: repeat_pct
              Type: double
        PartitionKeys:
          - Name: dt
            Type: date

  rHourOfDayHeatmapTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref pDatabaseName
      TableInput:
        Name: hour_of_day_heatmap
        Description: Search volume by hour of day (Vietnam time) per genre — date-partitioned CSV from Content Gap Lambda
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: csv
          skip.header.line.count: "1"
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2022-01-01,NOW+1YEARS"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub s3://${pStageBucket}/analytics/content-gap/hour_of_day_heatmap/${!dt}/
        StorageDescriptor:
          Location: !Sub s3://${pStageBucket}/analytics/content-gap/hour_of_day_heatmap/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ","
              serialization.format: ","
          Columns:
            - Name: hour_of_day_vn
              Type: int
            - Name: derived_genre
              Type: string
            - Name: searches
              Type: bigint
            - Name: pct_of_genre
              Type: double
        PartitionKeys:
          - Name: dt
            Type: date

  rGuestVsAuthDemandTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref pDatabaseName
      TableInput:
        Name: guest_vs_auth_demand
        Description: Guest vs authenticated demand by genre — date-partitioned CSV from Content Gap Lambda
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: csv
          skip.header.line.count: "1"
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: "2022-01-01,NOW+1YEARS"
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub s3://${pStageBucket}/analytics/content-gap/guest_vs_auth_demand/${!dt}/
        StorageDescriptor:
          Location: !Sub s3://${pStageBucket}/analytics/content-gap/guest_vs_auth_demand/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ","
              serialization.format: ","
          Columns:
            - Name: derived_genre
              Type: string
            - Name: total_searches
              Type: bigint
            - Name: auth_searches
              Type: bigint
            - Name: guest_searches
              Type: bigint
            - Name: guest_share_pct
              Type: double
        PartitionKeys:
          - Name: dt
            Type: date

Outputs:
  oPipelineReference:
    Description: CodePipeline reference this stack has been deployed with
    Value: !Ref pPipelineReference
  oContentGapFunctionArn:
    Description: ARN of the Content Gap Lambda
    Value: !GetAtt rContentGapFunction.Arn
  oTriggerRuleArn:
    Description: EventBridge rule ARN
    Value: !GetAtt rContentGapTriggerRule.Arn
