AWSTemplateFormatVersion: "2010-09-09"
Description: >
  OTT SDLF Documentation — S3 + CloudFront static hosting + CodePipeline CI/CD.
  On every push to the configured branch, CodeBuild installs Hugo, builds the site,
  syncs it to S3, and invalidates the CloudFront cache automatically.

Parameters:
  BucketSuffix:
    Type: String
    Description: >
      Short lowercase suffix appended to the S3 bucket name to make it globally
      unique (e.g. your AWS account alias or a short random string like "abc123").
    AllowedPattern: "[a-z0-9-]+"
    MinLength: 3
    MaxLength: 20

  GitHubOwner:
    Type: String
    Default: thanhtrung102
    Description: GitHub account / organisation that owns the repo.

  GitHubRepo:
    Type: String
    Default: ott-sdlf
    Description: GitHub repository name (without the owner prefix).

  GitHubBranch:
    Type: String
    Default: main
    Description: Branch whose pushes trigger a docs rebuild.

  HugoVersion:
    Type: String
    Default: "0.161.1"
    Description: Hugo extended version to install in CodeBuild (must match local dev).

  HugoSiteSubdir:
    Type: String
    Default: sdlf-main-ott
    Description: >
      Path inside the repo where config.toml lives (relative to repo root).
      Leave as "sdlf-main-ott" unless the Hugo site moves.

Resources:
  # ────────────────────────────────────────────────────────────────────────────
  # S3 — private bucket served only through CloudFront OAC
  # ────────────────────────────────────────────────────────────────────────────
  DocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ott-sdlf-docs-${BucketSuffix}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Suspended
      Tags:
        - Key: Project
          Value: ott-sdlf
        - Key: Component
          Value: docs

  DocsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${DocsBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DocsDistribution}"

  # ────────────────────────────────────────────────────────────────────────────
  # CloudFront — OAC + distribution
  # ────────────────────────────────────────────────────────────────────────────
  DocsOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "ott-sdlf-docs-oac-${BucketSuffix}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DocsDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: OTT SDLF Documentation
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt DocsBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt DocsOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf  # CORS-S3Origin
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
      Tags:
        - Key: Project
          Value: ott-sdlf
        - Key: Component
          Value: docs

  # ────────────────────────────────────────────────────────────────────────────
  # CodeStar Connection — GitHub authorization
  # NOTE: After deploying this stack, go to:
  #   AWS Console → Developer Tools → Connections → ott-sdlf-docs-github
  #   Click "Update pending connection" and authorise with GitHub.
  # ────────────────────────────────────────────────────────────────────────────
  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: ott-sdlf-docs-github
      ProviderType: GitHub

  # ────────────────────────────────────────────────────────────────────────────
  # CodeBuild — Hugo build + S3 sync + CloudFront invalidation
  # ────────────────────────────────────────────────────────────────────────────
  DocsBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: ott-sdlf-docs-build
      Description: Build Hugo docs and sync to S3
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: HUGO_VERSION
            Value: !Ref HugoVersion
          - Name: SITE_SUBDIR
            Value: !Ref HugoSiteSubdir
          - Name: BUCKET_NAME
            Value: !Ref DocsBucket
          - Name: DISTRIBUTION_ID
            Value: !Ref DocsDistribution
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - echo "Installing Hugo ${HUGO_VERSION}"
                - curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C /usr/local/bin hugo
                - hugo version
            build:
              commands:
                - cd "${SITE_SUBDIR}"
                - hugo --minify
                - echo "Hugo build complete; syncing to s3://${BUCKET_NAME}"
                - aws s3 sync public/ "s3://${BUCKET_NAME}" --delete --cache-control "max-age=300,public"
                - echo "Invalidating CloudFront distribution ${DISTRIBUTION_ID}"
                - aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths "/*"
          artifacts:
            files:
              - "**/*"
      Tags:
        - Key: Project
          Value: ott-sdlf
        - Key: Component
          Value: docs

  # ────────────────────────────────────────────────────────────────────────────
  # CodePipeline — Source (GitHub) → Build (CodeBuild)
  # ────────────────────────────────────────────────────────────────────────────
  DocsPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: ott-sdlf-docs-pipeline
      RoleArn: !GetAtt CodePipelineRole.Arn
      PipelineType: V2
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Sub "${GitHubOwner}/${GitHubRepo}"
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: "true"
              OutputArtifacts:
                - Name: SourceCode
        - Name: Build
          Actions:
            - Name: HugoBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref DocsBuildProject
              InputArtifacts:
                - Name: SourceCode
              OutputArtifacts:
                - Name: SiteArtifact
      Tags:
        - Key: Project
          Value: ott-sdlf
        - Key: Component
          Value: docs

  # Pipeline artifacts bucket (separate from docs bucket)
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ott-sdlf-docs-artifacts-${BucketSuffix}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireArtifacts
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: ott-sdlf
        - Key: Component
          Value: docs-artifacts

  # ────────────────────────────────────────────────────────────────────────────
  # IAM roles
  # ────────────────────────────────────────────────────────────────────────────
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ott-sdlf-docs-codebuild-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DocsBuildPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/ott-sdlf-docs-build*"
              - Sid: ArtifactsRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "${ArtifactsBucket.Arn}/*"
              - Sid: DocsBucketWrite
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetObject
                Resource: !Sub "${DocsBucket.Arn}/*"
              - Sid: DocsBucketList
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt DocsBucket.Arn
              - Sid: CloudFrontInvalidate
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DocsDistribution}"

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ott-sdlf-docs-codepipeline-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DocsPipelinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CodeStarConnection
                Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                Resource: !Ref GitHubConnection
              - Sid: Artifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub "${ArtifactsBucket.Arn}/*"
              - Sid: StartBuild
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt DocsBuildProject.Arn

# ────────────────────────────────────────────────────────────────────────────
Outputs:
  SiteURL:
    Description: HTTPS URL of the documentation site
    Value: !Sub "https://${DocsDistribution.DomainName}"

  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref DocsDistribution

  BucketName:
    Description: S3 bucket storing the built site
    Value: !Ref DocsBucket

  PipelineName:
    Description: CodePipeline name
    Value: !Ref DocsPipeline

  GitHubConnectionArn:
    Description: >
      CodeStar Connection ARN. After stack creation, visit AWS Console →
      Developer Tools → Connections → ott-sdlf-docs-github and click
      "Update pending connection" to authorise GitHub access.
    Value: !Ref GitHubConnection
