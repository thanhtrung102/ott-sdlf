version: 0.2

# SDLF convention: every stack is stamped with pPipelineReference so you can
# trace exactly which CodePipeline execution deployed which stack version.

env:
  variables:
    REGION: ap-southeast-1

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --quiet boto3

  pre_build:
    commands:
      - echo "Execution $PIPELINE_REFERENCE starting"
      - KMS_KEY=$(aws ssm get-parameter --name "/sdlf/storage/rKMSKey/prod" --query "Parameter.Value" --output text --region $REGION)
      - ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
      - STAGE_BUCKET=$(aws ssm get-parameter --name "/sdlf/storage/rStageBucket/prod" --query "Parameter.Value" --output text --region $REGION)
      - ANALYTICS_BUCKET=$(aws ssm get-parameter --name "/sdlf/storage/rAnalyticsBucket/prod" --query "Parameter.Value" --output text --region $REGION)
      - CURATED_DB=$(aws ssm get-parameter --name "/sdlf/dataset/rAnalyticsGlueDataCatalog/searchevents" --query "Parameter.Value" --output text --region $REGION)
      - CURATED_CRAWLER=$(aws ssm get-parameter --name "/sdlf/dataset/rAnalyticsGlueCrawler/searchevents" --query "Parameter.Value" --output text --region $REGION)
      - CRAWLER_ROLE=$(aws ssm get-parameter --name "/sdlf/dataset/rDatalakeCrawlerRole/searchevents" --query "Parameter.Value" --output text --region $REGION)
      - STAGE_B_SM_ARN=$(aws ssm get-parameter --name "/sdlf/pipeline/rStateMachine/ott-mainB" --query "Parameter.Value" --output text --region $REGION)
      - ATHENA_WG_CFG=$(aws athena get-work-group --work-group sdlf-ott --region $REGION --query "WorkGroup.Configuration.ResultConfiguration" --output json)
      - ATHENA_RESULTS_BUCKET=$(echo $ATHENA_WG_CFG | python3 -c "import json,sys; c=json.load(sys.stdin); print(c['OutputLocation'].split('/')[2])")
      - ATHENA_WG_KMS=$(echo $ATHENA_WG_CFG | python3 -c "import json,sys; c=json.load(sys.stdin); print(c.get('EncryptionConfiguration',{}).get('KmsKey',''))")
      # Discover the project bucket's KMS key so the LUT-Refresh role can write
      # the mirrored classifier zip (save_lut). The bucket is encrypted with a
      # different KMS key than the SDLF artifacts bucket.
      - PROJECT_KMS_ARN=$(aws s3api get-bucket-encryption --bucket "ott-search-${ACCOUNT}-prod" --region $REGION --query "ServerSideEncryptionConfiguration.Rules[0].ApplyServerSideEncryptionByDefault.KMSMasterKeyID" --output text)
      - echo "Account $ACCOUNT  KMS $KMS_KEY  AthenaResultsBucket $ATHENA_RESULTS_BUCKET  AthenaWgKms $ATHENA_WG_KMS  ProjectKms $PROJECT_KMS_ARN"
      - |
        # Legacy stack cleanup — keep these idempotent deletes so CI tears down
        # any stragglers from earlier revisions. The gold layer was removed
        # (the dashboard sources curated directly). The analytics API +
        # content-gap Lambdas were retired in favour of dashboard-with-full-
        # depth (single user-facing surface).
        for legacy_stack in sdlf-pipeline-ott-goldquality sdlf-pipeline-ott-contentgap sdlf-pipeline-ott-api; do
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name $legacy_stack --region $REGION \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NOT_FOUND")
          if [ "$STATUS" != "NOT_FOUND" ]; then
            echo "Deleting legacy $legacy_stack stack ($STATUS)..."
            aws cloudformation delete-stack \
              --stack-name $legacy_stack --region $REGION
            aws cloudformation wait stack-delete-complete \
              --stack-name $legacy_stack --region $REGION
            echo "$legacy_stack deleted."
          fi
        done
      - |
        # Drop the seven Glue catalog tables that backed the retired API.
        # The dashboard reads curated directly; these CSV-backed tables had
        # no remaining consumer.
        for legacy_table in trending_all trending_unknown content_gaps premium_vs_free repeat_search_rate hour_of_day_heatmap guest_vs_auth_demand; do
          aws glue delete-table --database-name "${CURATED_DB}" --name "$legacy_table" --region $REGION 2>/dev/null \
            && echo "Dropped $CURATED_DB.$legacy_table" \
            || true
        done

  build:
    commands:
      - |
        set -e

        deploy() {
          local stack=$1; local template=$2; shift 2
          echo ""
          echo "--- Deploying $stack ---"
          aws cloudformation deploy \
            --template-file "$template" \
            --stack-name "$stack" \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --region $REGION \
            --parameter-overrides pPipelineReference=$PIPELINE_REFERENCE "$@"
          echo "$stack OK"
        }

        # --- Stage the code artifacts the stacks reference by S3 URL ---
        # Without this a clean deploy fails: the Glue job and the 4 Lambda
        # stacks point at S3 objects that nothing else creates. The classifier
        # zip stays a manual prerequisite (binary, not in the repo) — see 5.2.5.
        echo ""
        echo "--- Staging Glue script ---"
        aws s3 cp sdlf-main-ott/glue/ott-search-glue-job.py \
          "s3://ott-search-${ACCOUNT}-prod/ott/searchevents/ott-search-glue-job.py" \
          --region $REGION
        echo "--- Staging analytics Lambda zips ---"
        python scripts/package_and_deploy_lambdas.py

        deploy sdlf-ott-searchevents-glue-job sdlf-main-ott/pipeline-ott-glue-job.yaml \
          pTeamName=ott \
          pDatasetName=searchevents \
          pArtifactsBucket=ott-search-${ACCOUNT}-prod \
          pKmsKeyArn=${KMS_KEY} \
          pPipelineDeploymentInstance=mainB \
          pRawBucket=/sdlf/storage/rRawBucket/prod \
          pStageBucket=/sdlf/storage/rStageBucket/prod \
          pAnalyticsBucket=/sdlf/storage/rAnalyticsBucket/prod

        deploy sdlf-pipeline-ott-mainA sdlf-main-ott/pipeline-ott-mainA.yaml

        deploy sdlf-pipeline-ott-mainB sdlf-main-ott/pipeline-ott-mainB.yaml

        deploy sdlf-pipeline-ott-dataquality sdlf-main-ott/pipeline-ott-dq-stage.yaml \
          pStageName=mainDQ \
          pDatabaseName=${CURATED_DB} \
          pTableName=curated \
          "pRulesetName=${CURATED_DB}_curated" \
          pCrawlerName=${CURATED_CRAWLER} \
          pCrawlerRoleArn=${CRAWLER_ROLE} \
          pStageBucket=${STAGE_BUCKET} \
          pKmsKeyArn=${KMS_KEY} \
          pDataReadBucket=${ANALYTICS_BUCKET} \
          pDataReadPrefix=ott/searchevents/ \
          pResultsS3Prefix=dq-results/ott/searchevents \
          pTriggerType=statesMachine \
          pStageBSmArn=${STAGE_B_SM_ARN} \
          pExportRoles=true

        deploy sdlf-pipeline-ott-lutrefresh sdlf-main-ott/pipeline-ott-lutrefresh.yaml \
          pMaxNewKeywords=${MAX_NEW_KEYWORDS} \
          pBedrockModelId=${BEDROCK_MODEL_ID} \
          pAthenaResultsBucket=${ATHENA_RESULTS_BUCKET} \
          pAthenaWorkgroupKmsKey=${ATHENA_WG_KMS} \
          pProjectBucketKmsKeyArn=${PROJECT_KMS_ARN}

        # Dashboard renderer — runs every dashboard section query at full
        # depth (500-row content gaps, 216-row hour×genre heatmap) and writes
        # index.html to the CloudFront-fronted dashboard bucket. Single
        # user-facing presentation surface — the analytics API and the
        # standalone content-gap Lambda were retired.
        deploy sdlf-pipeline-ott-trending sdlf-main-ott/pipeline-ott-trending.yaml \
          pAthenaResultsBucket=${ATHENA_RESULTS_BUCKET} \
          pAthenaWorkgroupKmsKey=${ATHENA_WG_KMS}

        deploy sdlf-pipeline-ott-monitoring sdlf-main-ott/pipeline-ott-monitoring.yaml

        deploy sdlf-pipeline-ott-lakeformation sdlf-main-ott/pipeline-ott-lakeformation.yaml

        # Dashboard hosting — private S3 bucket + CloudFront (OAC). The Trending
        # Lambda's write_dashboard() publishes index.html here every run.
        deploy sdlf-pipeline-ott-dashboard sdlf-main-ott/pipeline-ott-dashboard.yaml

  post_build:
    commands:
      - |
        echo ""
        echo "All stacks deployed. Verifying stack statuses..."
        for stack in \
          sdlf-ott-searchevents-glue-job \
          sdlf-pipeline-ott-mainA \
          sdlf-pipeline-ott-mainB \
          sdlf-pipeline-ott-dataquality \
          sdlf-pipeline-ott-lutrefresh \
          sdlf-pipeline-ott-trending \
          sdlf-pipeline-ott-monitoring \
          sdlf-pipeline-ott-lakeformation \
          sdlf-pipeline-ott-dashboard; do
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name $stack --region $REGION \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NOT_FOUND")
          echo "$stack: $STATUS"
          case $STATUS in
            CREATE_COMPLETE|UPDATE_COMPLETE) ;;
            *) echo "ERROR: $stack in unexpected state $STATUS"; exit 1 ;;
          esac
        done
        echo ""
        echo "Pushing analytics Lambda code to the live functions..."
        python scripts/package_and_deploy_lambdas.py --update-live
        echo ""
        echo "Deploy $PIPELINE_REFERENCE complete."
